<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neuro-symbolic — kết quả 20 ca</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#5b6577;--line:#dce2eb;--bg:#f4f6fa;--blue:#2454b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:24px max(20px,calc((100vw - 1240px)/2)) 18px;position:sticky;top:0;z-index:2}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted)}.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.pill{border:1px solid var(--line);background:#fff;padding:6px 11px;border-radius:99px}.pill b{color:var(--blue)}
button{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}button.active{background:var(--blue);color:white;border-color:var(--blue)}
main{max-width:1240px;margin:22px auto;padding:0 16px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px}
article{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #1525480b}
.cardhead{display:flex;justify-content:space-between;align-items:center;padding:12px 15px 8px}.cardhead h2{font-size:17px;margin:0}.status{font-weight:650;font-size:13px;padding:3px 9px;border-radius:99px}.ok{background:#e5f7ed;color:#126738}.bad{background:#fff0e8;color:#a23f13}
img{display:block;width:100%;height:240px;object-fit:contain;background:#f0f2f5;border-block:1px solid var(--line)}.body{padding:12px 15px 15px}.label{font-size:12px;color:var(--muted);margin-bottom:8px}.q{margin:0 0 10px}.answer{border-left:3px solid var(--blue);padding:8px 10px;background:#f5f8ff;border-radius:0 8px 8px 0}.answer b{display:block;font-size:12px;color:#34569b;margin-bottom:3px}details{margin-top:10px;color:var(--muted)}summary{cursor:pointer}details p{margin:6px 0;color:var(--ink)}
@media(max-width:600px){header{position:static}h1{font-size:21px}img{height:205px}}
</style></head><body>
<header><h1>Câu trả lời Neuro-symbolic</h1><div class="sub">20 ảnh test · 10 đúng, 10 sai theo đối chiếu ngữ nghĩa với đáp án chuẩn.</div>
<div class="stats"><span class="pill"><b>50%</b> độ chính xác</span><span class="pill">20 câu hỏi</span><button class="active" data-filter="all">Tất cả</button><button data-filter="wrong">Câu sai</button><button data-filter="correct">Câu đúng</button></div></header>
<main id="gallery"></main>
<script>
const cases=[{"case_id": "TC01", "image": "images/01_675.png", "question": "Khu vực trong ảnh có lưu ý gì dành cho người đi bộ?", "answer": "Khu vực có biển báo \"Vị trí người đi bộ sang ngang\". Theo quy định, khi gặp biển này, người tham gia giao thông phải điều khiển xe chạy chậm, chú ý quan sát, ưu tiên cho người đi bộ sang ngang.", "gold": "Phía trước có khu vực dành cho người đi bộ qua đường. Hãy giảm tốc độ, quan sát và nhường người đi bộ khi cần.", "correct": true, "label": "Pedestrian_crossing_zone"}, {"case_id": "TC02", "image": "images/02_31344.png", "question": "Phía trước có nguy cơ gì và người lái xe nên chú ý điều gì?", "answer": "Chưa thể kết luận được phép hay bị cấm (kết quả UNKNOWN). Một hoặc nhiều yêu cầu cần được trả lời riêng; xem intent_evaluations.", "gold": "Phía trước có khúc cua nguy hiểm sang trái. Hãy giảm tốc độ và đi đúng phần đường.", "correct": false, "label": "Dangerous_curve_left"}, {"case_id": "TC03", "image": "images/03_568frame_00011.png", "question": "Đoạn đường phía trước thay đổi như thế nào và người lái xe cần lưu ý gì?", "answer": "Chưa thể kết luận được phép hay bị cấm (kết quả UNKNOWN). Một hoặc nhiều yêu cầu cần được trả lời riêng; xem intent_evaluations.", "gold": "Phía trước mặt đường bị thu hẹp. Hãy giảm tốc độ, chú ý xe đi ngược chiều và giữ khoảng cách an toàn.", "correct": false, "label": "Road_narrows"}, {"case_id": "TC04", "image": "images/04_34225_aug_181.png", "question": "Từ vị trí có biển này, quy định cấm vượt còn tiếp tục áp dụng không?", "answer": "Chưa thể kết luận được phép hay bị cấm (kết quả CONDITIONAL). B.33: DP.133 ends the effects of P.125 and P.126; motor vehicles may overtake subject to the legal conditions for overtaking. This sign alone does not establish that a particular maneuver satisfies those conditions.", "gold": "Không. Biển báo hết cấm vượt cho biết lệnh cấm vượt trước đó kết thúc tại vị trí này; vẫn phải tuân thủ các hạn chế khác nếu có.", "correct": true, "label": "End_no_overtaking"}, {"case_id": "TC05", "image": "images/05_819.png", "question": "Tại vị trí này, xe có được đi thẳng không?", "answer": "Tại vị trí này, xe không được phép đi thẳng theo biển báo P.136 \"Cấm đi thẳng\". Biển này cấm tất cả các loại xe, trừ xe ưu tiên, đi thẳng tại nút giao đường.", "gold": "Không. Biển cấm xe đi thẳng tại vị trí này.", "correct": true, "label": "No_straight_ahead"}, {"case_id": "TC06", "image": "images/06_21377.png", "question": "Tại vị trí này, xe có được quay đầu không?", "answer": "Tại vị trí này, xe không được phép quay đầu theo QCVN 41:2024/BGTVT Phụ lục B.24(a,g) vì có biển báo cấm quay đầu xe.", "gold": "Không. Biển cấm xe quay đầu tại vị trí này.", "correct": true, "label": "No_U_turn"}, {"case_id": "TC07", "image": "images/07_17372_aug_150.png", "question": "Khi đến nút giao phía trước, người lái xe cần nhường đường cho hướng nào?", "answer": "Chưa thể kết luận được phép hay bị cấm (kết quả UNKNOWN). Một hoặc nhiều yêu cầu cần được trả lời riêng; xem intent_evaluations.", "gold": "Có đường nhánh không ưu tiên nối vào từ bên trái. Nếu bạn đang đi trên đường ưu tiên, xe từ nhánh bên trái phải nhường đường; hãy quan sát và xử lý theo tình hình thực tế tại nút giao.", "correct": false, "label": "Intersection_with_non_priority_road_left"}, {"case_id": "TC08", "image": "images/08_32453.png", "question": "Xe có được đi tiếp vào đoạn đường phía trước không?", "answer": "Chưa thể kết luận được phép hay bị cấm (kết quả UNKNOWN). Chưa có rule đã áp dụng cho biển P.101 trong câu hỏi này.", "gold": "Không. Biển báo đường cấm cho biết xe không được đi vào đoạn đường phía trước.", "correct": false, "label": "Road_closed"}, {"case_id": "TC09", "image": "images/09_11213.png", "question": "Biển báo trong ảnh hạn chế việc đỗ xe vào những ngày nào?", "answer": "Biển P.131c cấm đỗ xe vào những ngày chẵn.", "gold": "Biển cấm đỗ xe vào các ngày chẵn trong tháng.", "correct": true, "label": "No_parking_even_days"}, {"case_id": "TC10", "image": "images/10_34219_aug_175.png", "question": "Từ vị trí có biển này, quy định cấm vượt còn tiếp tục áp dụng không?", "answer": "Chưa thể kết luận được phép hay bị cấm (kết quả CONDITIONAL). B.33: DP.133 ends the effects of P.125 and P.126; motor vehicles may overtake subject to the legal conditions for overtaking. This sign alone does not establish that a particular maneuver satisfies those conditions.", "gold": "Không. Biển báo hết cấm vượt cho biết lệnh cấm vượt trước đó kết thúc tại vị trí này; vẫn phải tuân thủ các hạn chế khác nếu có.", "correct": true, "label": "End_no_overtaking"}, {"case_id": "TC11", "image": "images/11_9571_aug_300.png", "question": "Tốc độ tối đa được phép theo biển báo trong ảnh là bao nhiêu?", "answer": "Theo biển báo, tốc độ tối đa được phép là 40 km/h và 60 km/h.", "gold": "Tốc độ tối đa là 40 km/h. Biển phía dưới chỉ tốc độ tối thiểu 30 km/h, không làm thay đổi mức tối đa 40 km/h.", "correct": false, "label": "Speed_limit_40"}, {"case_id": "TC12", "image": "images/12_7208.png", "question": "Người lái xe cần chú ý gì khi đến khu vực phía trước?", "answer": "Khi đến khu vực phía trước có biển báo \"Đường người đi bộ cắt ngang\" (W.224), người lái xe cần giảm tốc độ, nhường ưu tiên cho người đi bộ và chỉ được chạy xe khi không gây nguy hiểm cho người đi bộ.", "gold": "Phía trước có chỗ người đi bộ qua đường. Hãy giảm tốc độ, quan sát và nhường người đi bộ khi cần.", "correct": true, "label": "Pedestrian_crossing"}, {"case_id": "TC13", "image": "images/13_32565.png", "question": "Biển báo cho biết xe đang đi vào khu vực nào?", "answer": "Biển báo cho biết xe đang đi vào khu vực dành cho người khuyết tật.", "gold": "Biển báo cho biết xe đang đi vào khu đông dân cư. Hãy tuân thủ tốc độ và các quy định áp dụng trong khu vực này.", "correct": false, "label": "Residential_area"}, {"case_id": "TC14", "image": "images/14_11820_aug_95.png", "question": "Xe mô tô có được đi vào tuyến đường này không?", "answer": "Chưa thể kết luận được phép hay bị cấm (kết quả UNKNOWN). Chưa có rule đã áp dụng cho biển P.112 trong câu hỏi này.", "gold": "Không. Biển cấm xe mô tô đi vào tuyến đường này.", "correct": false, "label": "No_motorcycles"}, {"case_id": "TC15", "image": "images/15_13754.png", "question": "Khi gặp biển báo này, người lái xe cần đi theo dạng nút giao nào?", "answer": "Theo biển báo R.303 \"Nơi giao nhau chạy theo vòng xuyến\", người lái xe cần đi theo dạng nút giao vòng xuyến.", "gold": "Phía trước là nút giao vòng xuyến. Khi đi qua, đi theo chiều mũi tên và tuân thủ biển báo, vạch kẻ đường tại nút giao.", "correct": true, "label": "Roundabout"}, {"case_id": "TC16", "image": "images/16_10563_aug_179.png", "question": "Phần đường bị thu hẹp ở phía nào?", "answer": "Đường bị thu hẹp về phía phải.", "gold": "Phần đường bị thu hẹp ở bên trái.", "correct": false, "label": "Road_narrows_left"}, {"case_id": "TC17", "image": "images/17_21977.png", "question": "Địa điểm hoặc dịch vụ giao thông nào được báo hiệu trong ảnh?", "answer": "Biển báo hiệu bến xe buýt.", "gold": "Biển báo điểm dừng xe buýt.", "correct": true, "label": "Bus_stop"}, {"case_id": "TC18", "image": "images/18_32709.png", "question": "Biển báo cho biết xe đang đi vào khu vực nào?", "answer": "Biển báo R.420 cho biết xe đang đi vào khu vực đông dân cư.", "gold": "Biển báo cho biết xe đang đi vào khu đông dân cư. Hãy tuân thủ tốc độ và các quy định áp dụng trong khu vực này.", "correct": true, "label": "Residential_area"}, {"case_id": "TC19", "image": "images/19_1710.png", "question": "Phía trước là nút giao dạng nào và nhánh đường rẽ về phía nào?", "answer": "Biển báo cho thấy phía trước là nút giao đường cùng mức, không có ưu tiên đường nào.", "gold": "Phía trước là nút giao hình chữ T, nhánh đường nhập từ bên trái.", "correct": false, "label": "T_junction_left"}, {"case_id": "TC20", "image": "images/20_11340.png", "question": "Ô tô có được đi vào tuyến đường này không?", "answer": "Chưa thể kết luận được phép hay bị cấm (kết quả UNKNOWN). Chưa có rule đã áp dụng cho biển P.103a trong câu hỏi này.", "gold": "Không. Biển cấm ô tô đi vào tuyến đường này.", "correct": false, "label": "No_cars"}];
const gallery=document.getElementById('gallery');
function render(filter='all'){
 gallery.innerHTML=cases.filter(c=>filter==='all'||(filter==='correct'?c.correct:!c.correct)).map(c=>`<article data-correct="${c.correct}"><div class="cardhead"><h2>${c.case_id}</h2><span class="status ${c.correct?'ok':'bad'}">${c.correct?'Đúng':'Sai'}</span></div><img src="${c.image}" alt="Ảnh giao thông ${c.case_id}" loading="lazy"><div class="body"><div class="label">Nhãn tham chiếu: ${c.label}</div><p class="q"><b>Câu hỏi:</b> ${c.question}</p><div class="answer"><b>Neuro-symbolic trả lời</b>${c.answer}</div><details><summary>Xem đáp án chuẩn</summary><p>${c.gold}</p></details></div></article>`).join('');
}
document.querySelectorAll('button[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}));
render();
</script></body></html>
